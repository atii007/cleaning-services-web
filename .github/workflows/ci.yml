name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Malware scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Scan BEFORE installing anything — install-time hooks are an attack vector.
      - name: Scan tracked files
        run: sh scripts/security/scan-malware.sh --all

  quality:
    name: Lint, type-check, format & build
    needs: security-scan
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Type-check
        run: yarn type-check
      - name: Format check
        run: yarn format:check
      - name: Build
        run: yarn build
